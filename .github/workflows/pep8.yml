name: PEP 8 Enforcement

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  pep8:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.username != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PEP 8 tools
        run: pip install flake8 autopep8

      - name: Run flake8 to detect violations
        run: |
          echo "=== PEP 8 violations detected by flake8 ==="
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 flake8 --format="%(path)s:%(row)d:%(col)d: %(code)s %(text)s" \
            || true

      - name: Apply PEP 8 formatting with autopep8
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 autopep8 --in-place --aggressive --aggressive

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No PEP 8 changes required. Exiting."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Python files require PEP 8 fixes:"
            git diff --name-only
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for duplicate open PR
        if: steps.changes.outputs.changed == 'true'
        id: duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list \
            --base main \
            --state open \
            --json title \
            --jq '[.[] | select(.title | startswith("Automated: Apply PEP 8"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "A PEP 8 enforcement PR is already open. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit changes
        if: steps.changes.outputs.changed == 'true' && steps.duplicate.outputs.exists == 'false'
        id: branch
        run: |
          BRANCH="automated/pep8-fixes-$(date +%Y%m%d-%H%M%S)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 git add
          git commit -m "Automated: Apply PEP 8 formatting fixes"
          git push origin "$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true' && steps.duplicate.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          CHANGED_FILES=$(git diff origin/main.."$BRANCH" --name-only -- '*.py' \
            | sed 's/^/- /')

          printf '## Automated PEP 8 Fixes\n\n' > /tmp/pr_body.md
          printf 'This pull request was automatically generated to enforce Python coding\n' >> /tmp/pr_body.md
          printf 'standards based on [PEP 8](https://peps.python.org/pep-0008/).\n\n' >> /tmp/pr_body.md
          printf '### Modified Files\n\n' >> /tmp/pr_body.md
          printf '%s\n\n' "$CHANGED_FILES" >> /tmp/pr_body.md
          printf '### Tools Used\n\n' >> /tmp/pr_body.md
          printf -- '- `autopep8`: Automatically formatted Python files to comply with PEP 8\n' >> /tmp/pr_body.md
          printf -- '- `flake8`: Identified linting violations\n' >> /tmp/pr_body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated: Apply PEP 8 formatting fixes" \
            --body-file /tmp/pr_body.md

name: Python Lint & Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install ruff flake8

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Flake8 strict check
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 flake8 --max-line-length=120 --extend-ignore=E501

  auto-fix:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.head_commit.author.username != 'github-actions[bot]'
    needs: lint
    # Only run auto-fix if lint failed; we re-run ruff to apply fixes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: pip install ruff autopep8

      - name: Apply ruff format + autopep8 fixes
        run: |
          ruff format .
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 autopep8 --in-place --aggressive --aggressive

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Files requiring formatting fixes:"
            git diff --name-only
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for duplicate open PR
        if: steps.changes.outputs.changed == 'true'
        id: duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list \
            --base main \
            --state open \
            --json title \
            --jq '[.[] | select(.title | startswith("Automated: Apply formatting"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "A formatting PR is already open. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit changes
        if: steps.changes.outputs.changed == 'true' && steps.duplicate.outputs.exists == 'false'
        id: branch
        run: |
          BRANCH="automated/format-fixes-$(date +%Y%m%d-%H%M%S)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 git add
          git commit -m "Automated: Apply Python formatting fixes"
          git push origin "$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true' && steps.duplicate.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          CHANGED_FILES=$(git diff origin/main.."$BRANCH" --name-only -- '*.py' \
            | sed 's/^/- /')

          printf '## Automated Python Formatting Fixes\n\n' > /tmp/pr_body.md
          printf 'This PR was automatically generated to enforce Python coding standards.\n\n' >> /tmp/pr_body.md
          printf '### Tools Used\n\n' >> /tmp/pr_body.md
          printf -- '- `ruff format`: Fast Python formatter\n' >> /tmp/pr_body.md
          printf -- '- `autopep8`: Additional PEP 8 compliance fixes\n\n' >> /tmp/pr_body.md
          printf '### Modified Files\n\n' >> /tmp/pr_body.md
          printf '%s\n' "$CHANGED_FILES" >> /tmp/pr_body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated: Apply formatting fixes" \
            --body-file /tmp/pr_body.md

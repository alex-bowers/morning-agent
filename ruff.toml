# Ruff configuration — https://docs.astral.sh/ruff/settings/

line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E203",   # whitespace before ':' (conflicts with ruff formatter)
    "B008",   # function call in default argument (common in FastAPI/etc)
    "B905",   # zip-without-explicit-strict
]

[lint.isort]
known-first-party = ["agent", "servers"]

[format]
quote-style = "double"
indent-style = "space"
